services:
  web-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-service-container
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    networks:
      - internal-net

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-service
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
